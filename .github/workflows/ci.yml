# CI —— 3 个并行 Job：Backend / Frontend / E2E
#
# 说明（首次启用前需人工复核一次）：
# 1. Backend 必须在 windows-latest：tests/ 含 5 个 Windows 专属测试
#    （netstat 端口探测 / powershell 父进程链 / C: 绝对路径 / 跨盘相对化）。
# 2. 依赖安装：后端 uv sync（pyproject.toml + uv.lock，无 requirements.txt）；
#    前端 npm ci（package-lock.json）。dist/ 被 git 忽略，任何需要 UI 的
#    Job（含 E2E）都必须自己构建 frontend/dist。
# 3. 索引：仓库自己钉死官方 PyPI（pyproject 的 [tool.uv.index] default = pypi），
#    uv.lock 也只记官方地址，CI 用 `uv sync --locked` 按锁装。
#    为什么必须由仓库钉死：uv.lock 会把 registry **固化到每个包**（连 sdist/wheels 的
#    绝对下载 URL 一起记）。所以「跑 uv lock 那台机器用的是哪个源」直接决定锁文件内容 ——
#    曾配了镜像，锁里就是镜像的物理地址，海外 runner 连不上必然超时
#    （连续两次挂在 uv sync：先 packaging 后 charset-normalizer）。
#    实测过：`--locked` 下 job 级 UV_INDEX_URL 覆盖不了锁里记的地址（锁里是绝对 URL，
#    不是 index 名），因此「锁走官方 + 装走镜像」在锁定安装下做不到。
#    本地要加速只能改本机（会同时让锁文件回到镜像源，别把那种锁提交上来）。
# 4. E2E 目前（verify_canvas.py，36 断言）只测画布交互，不触发生成接口，
#    因此无需 mock 上游 API。未来若 E2E 覆盖「生成→回流」链路，必须先
#    mock core/api.py 的 generate_image（monkeypatch 返回固定图），
#    严禁 CI 直连真实上游（花钱）。落地前为 AGENTS.md「待办」。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 只读：本 workflow 不写回仓库、不做发布。显式声明，避免 GITHUB_TOKEN 拿到多余权限。
permissions:
  contents: read

jobs:
  backend:
    name: Backend checks (pytest + ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        # --locked：断言锁文件不会被改动；与 pyproject 不同步时直接红（比 --frozen 严格，
        # --frozen 只是不更新、不同步也不报错）。本地已验证 uv lock --check 通过。
        run: uv sync --locked --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format check
        # 本次新增：钩子与 CI 此前都只跑 ruff check，格式没进任何闸门。
        run: uv run ruff format --check .
      - name: Pytest
        # --basetemp 用 runner 内置临时目录（${{ runner.temp }}，纯 ASCII 且必定可写）：
        # 本地命令用 `--basetemp=<ASCII 临时目录>`（见 AGENTS.md 活跃坑），CI 与本地命令不再互拷。
        run: uv run pytest --basetemp="${{ runner.temp }}/imagora-pytest"

  frontend:
    name: Frontend checks (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Docs check (links + dashboard counts)
        # 排在 npm ci 之前：只读仓库文件、不装任何依赖，几十秒就能判红，没必要等构建。
        # 本 job 的默认 working-directory 是 frontend/，这里显式回到仓库根——
        # 脚本按自身位置解析根目录，命令写法与 AGENTS / scripts/README 里那条保持一致。
        # ubuntu runner 自带 python3，脚本只用标准库。（本地仍写作 `python`，见 scripts/README.md）
        working-directory: .
        run: python3 scripts/check_docs.py --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (canvas regression, Playwright)
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: uv sync --locked --group dev
      - name: Build frontend (dist/ is git-ignored)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium browser
        # playwright Python 包已进 pyproject.toml [dependency-groups] dev，上一步 uv sync 已装入 .venv；
        # 本步只下载浏览器二进制（--with-deps 仅 Linux 可用，Windows 免系统依赖，故不加）。
        run: |
          .\.venv\Scripts\python.exe -m playwright install chromium
      - name: Start server and run E2E
        shell: pwsh
        run: |
          # 服务输出落文件：万一没起来，下面能直接把原因打出来（原先 Hidden 且无重定向，失败时无线索）
          $server = Start-Process -FilePath ".\.venv\Scripts\python.exe" `
            -ArgumentList "-m", "main", "ui", "--no-browser", "--port", "7860" `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log
          try {
            # 等就绪再开浏览器：uvicorn 冷启动 + 前端 dist 静态挂载需要时间，
            # 起完立刻 goto 会 ERR_CONNECTION_REFUSED（曾实测偶发失败）
            $ready = $false
            foreach ($i in 1..60) {
              try {
                $null = Invoke-WebRequest "http://127.0.0.1:7860/api/config?win=1" -TimeoutSec 2 -UseBasicParsing
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Write-Host "::error::服务 60 秒内未就绪，以下是服务输出："
              Get-Content server.out.log, server.err.log -ErrorAction SilentlyContinue
              exit 1
            }
            .\.venv\Scripts\python.exe frontend\e2e\verify_canvas.py
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
        # TODO(mock): 若 E2E 新增生成链路覆盖，必须先 mock core/api.py 的
        # generate_image（返回固定测试图），并同步 AGENTS.md 待办与本文档第 4 条。

  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行
  #      （本仓 e2e 依赖 backend/frontend，只列 e2e 的话上游失败时 e2e 变 skipped、门禁放行）。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1