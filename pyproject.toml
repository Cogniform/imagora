[project]
name = "imagora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.11.0",
    "playwright>=1.40",
]

[tool.uv]
# 默认索引显式钉在官方 PyPI（**提交物**，必须对所有人中性）。
#
# 为什么不能用 `index-url = tuna`：uv.lock 会把 registry **固化到每个包**，连
# sdist/wheels 的绝对下载 URL 一起记（锁里存的是镜像站物理地址）。于是
# `uv sync --frozen/--locked` 只认 lock 里记的地址，job 级 env 的 UV_INDEX_URL
# 会被忽略 —— 海外 runner 去连国内镜像必然超时（连续两次挂在 uv sync：
# 先 packaging 后 charset-normalizer）。
#
# 同理，生成锁文件的机器若配了镜像，锁也会被写成镜像地址。所以索引这件事
# 必须由仓库自己钉死，不能依赖「跑命令那台机器的全局配置」。
#
# 本地要加速不改这里：见 README 的「本地加速」一节（改本机全局 uv.toml）。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# FastAPI 惯例: B008 允许 File/Form 作为参数默认值; BLE001 允许路由层盲捕获兜底
# S110: 进程退出路径的静默清理（卸载 console handler）失败无害
extend-ignore = ["B008", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# 测试允许盲断言异常、简化导入写法
"tests/**" = ["B017", "PLR0402"]
